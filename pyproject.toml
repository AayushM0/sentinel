[project]
name = "sentinel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aayush Mittal", email = "aayushmittal620@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "daytona>=0.10.0",
    "mcp>=2.1.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
exclude = [".agents", ".venv"]
line-length = 100


